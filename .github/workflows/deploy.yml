name: Deploy no Kubernetes

on:
  workflow_call:
    inputs:
      environment-name:
        type: string
        required: true
      environment-url:
        type: string
        required: true

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.environment-name}}
      url: ${{ inputs.environment-url}}
    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4

      - name: Login no OCIR
        uses: docker/login-action@v3
        with:
          registry: gru.ocir.io
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}

      # ==========================================================
      # OCI CLI
      # ==========================================================
      - name: Instalar OCI CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install oci-cli

      - name: Verificar OCI CLI
        run: |
          echo "PATH=$PATH"
          which oci
          oci --version

      # ==========================================================
      # Configuração das credenciais OCI
      # ==========================================================
      - name: Configurar OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          set -e

          mkdir -p ~/.oci

          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

          echo "Configuracao da OCI CLI criada."

      # ==========================================================
      # Kubernetes
      # ==========================================================

      # ----------------------------------------------------------
      # Configurar  kubeconfig
      # ----------------------------------------------------------
      - name: Configuração de contexto do Kubernetes
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_CONFIG }}

      - name: Debug namespace
        run: |
          echo "Environment: ${{ job.environment.name }}"
          echo "BASE_NAMESPACE=${{ vars.DEPLOY_TARGET }}"
          grep -n "namespace:" k8s/oci-ingress.yaml

      - name: Update rules ingress
        run: "sed -i 's/host: homologacao.ajotainformaticacloud.com.br/host: ${{vars.BASE_URL}}/g' k8s/oci-ingress.yaml"

      - name: Update namespace na oci-ingress
        run: "sed -i 's/namespace: homologacao/namespace: ${{vars.DEPLOY_TARGET}}/g'  k8s/oci-ingress.yaml"

      - name: Validar namespace
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          grep -q "namespace: ${DEPLOY_TARGET}" k8s/oci-ingress.yaml \
          && echo "OK - namespace foi trocado" \
          || { echo "ERRO - namespace não foi trocado"; exit 1; }

      # ==========================================================
      # Aplicar Ingress
      # ==========================================================
      - name: Configurar OCI Native Ingress
        run: |
          kubectl apply -f k8s/oci-ingress.yaml

      # ----------------------------------------------------------
      # Aplicar Deployments e Services
      # ----------------------------------------------------------
      - name: Aplicar Manifesto
        uses: Azure/k8s-deploy@v7
        with:
          action: deploy
          namespace: ${{secrets.K8S_NAMESPACE}}
          manifests: k8s/deployment.yaml
          images: gru.ocir.io/grglog7bpvjm/projeto-devops-pro:v${{ github.run_number }}